version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: ump-postgres-prod
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ump_production}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-ump_production}',
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - ump-network
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 512M
          cpus: '0.25'

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: ump-redis-prod
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        [
          'CMD',
          'redis-cli',
          '--no-auth-warning',
          '-a',
          '${REDIS_PASSWORD}',
          'ping',
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - ump-network
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.25'
        reservations:
          memory: 256M
          cpus: '0.1'

  # Backend Service
  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile.production
      args:
        NODE_ENV: production
    container_name: ump-backend-prod
    environment:
      - NODE_ENV=production
      - PORT=${BACKEND_PORT:-4001}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ump_production}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
      - SENTRY_DSN=${SENTRY_DSN}
    ports:
      - '${BACKEND_PORT:-4001}:${BACKEND_PORT:-4001}'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        ['CMD', 'curl', '-f', 'http://localhost:${BACKEND_PORT:-4001}/health']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - ump-network
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 512M
          cpus: '0.25'

  # Gateway Service
  gateway:
    build:
      context: .
      dockerfile: packages/gateway/Dockerfile.production
      args:
        NODE_ENV: production
    container_name: ump-gateway-prod
    environment:
      - NODE_ENV=production
      - PORT=${GATEWAY_PORT:-3000}
      - CORE_SUBGRAPH_URL=http://backend:${BACKEND_PORT:-4001}/graphql
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - SENTRY_DSN=${SENTRY_DSN}
    ports:
      - '${GATEWAY_PORT:-3000}:${GATEWAY_PORT:-3000}'
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        ['CMD', 'curl', '-f', 'http://localhost:${GATEWAY_PORT:-3000}/health']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - ump-network
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.25'
        reservations:
          memory: 256M
          cpus: '0.1'

  # Admin Frontend
  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile.production
      args:
        NODE_ENV: production
        NEXT_PUBLIC_GRAPHQL_HTTP_URL: ${GRAPHQL_HTTP_URL}
        NEXT_PUBLIC_GRAPHQL_WS_URL: ${GRAPHQL_WS_URL}
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY}
    container_name: ump-admin-prod
    environment:
      - NODE_ENV=production
      - PORT=${ADMIN_PORT:-3000}
    ports:
      - '${ADMIN_PORT:-3000}:3000'
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/api/health']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - ump-network
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.25'
        reservations:
          memory: 256M
          cpus: '0.1'

  # Mobile Frontend
  mobile:
    build:
      context: .
      dockerfile: apps/mobile/Dockerfile.production
      args:
        NODE_ENV: production
        NEXT_PUBLIC_GRAPHQL_HTTP_URL: ${GRAPHQL_HTTP_URL}
        NEXT_PUBLIC_GRAPHQL_WS_URL: ${GRAPHQL_WS_URL}
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY}
    container_name: ump-mobile-prod
    environment:
      - NODE_ENV=production
      - PORT=${MOBILE_PORT:-3001}
    ports:
      - '${MOBILE_PORT:-3001}:3000'
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/api/health']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - ump-network
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.25'
        reservations:
          memory: 256M
          cpus: '0.1'

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: ump-nginx-prod
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./deployment/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deployment/nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - admin
      - mobile
      - gateway
    restart: unless-stopped
    networks:
      - ump-network
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.1'
        reservations:
          memory: 64M
          cpus: '0.05'

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  nginx_logs:
    driver: local

networks:
  ump-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
