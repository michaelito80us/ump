name: Lighthouse CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

jobs:
  lighthouse:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build applications
        run: pnpm run build
        env:
          NODE_ENV: production

      - name: Start mobile app server
        run: |
          cd apps/mobile
          pnpm start &
          sleep 30
        env:
          NODE_ENV: production
          PORT: 3000

      - name: Wait for server to be ready
        run: |
          timeout 60 bash -c 'until curl -f http://localhost:3000; do sleep 2; done'

      - name: Run Lighthouse CI
        run: pnpm lhci autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
          LHCI_TOKEN: ${{ secrets.LHCI_TOKEN }}

      - name: Upload Lighthouse results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-results
          path: .lighthouseci/
          retention-days: 30

      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            try {
              const resultsPath = '.lighthouseci/lhr-*.json';
              const glob = require('glob');
              const files = glob.sync(resultsPath);
              
              if (files.length > 0) {
                const results = JSON.parse(fs.readFileSync(files[0], 'utf8'));
                const scores = results.categories;
                
                const comment = `## 🚦 Lighthouse CI Results\n\n` +
                  `| Category | Score |\n` +
                  `|----------|-------|\n` +
                  `| Performance | ${Math.round(scores.performance.score * 100)} |\n` +
                  `| Accessibility | ${Math.round(scores.accessibility.score * 100)} |\n` +
                  `| Best Practices | ${Math.round(scores['best-practices'].score * 100)} |\n` +
                  `| SEO | ${Math.round(scores.seo.score * 100)} |\n` +
                  `| PWA | ${Math.round(scores.pwa.score * 100)} |\n`;
                
                github.rest.issues.createComment({
                  issue_number: context.issue.number,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body: comment
                });
              }
            } catch (error) {
              console.log('Could not post Lighthouse results:', error.message);
            }
