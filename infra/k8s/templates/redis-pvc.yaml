{{- if and .Values.redis.enabled .Values.redis.master.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "ump.fullname" . }}-redis-pvc
  labels:
    {{- include "ump.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  accessModes:
    - {{ .Values.redis.master.persistence.accessMode | default "ReadWriteOnce" | quote }}
  resources:
    requests:
      storage: {{ .Values.redis.master.persistence.size | quote }}
  {{- if .Values.redis.master.persistence.storageClass }}
  {{- if (eq "-" .Values.redis.master.persistence.storageClass) }}
  storageClassName: ""
  {{- else }}
  storageClassName: {{ .Values.redis.master.persistence.storageClass | quote }}
  {{- end }}
  {{- end }}
{{- end }}