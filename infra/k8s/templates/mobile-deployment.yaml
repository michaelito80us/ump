{{- if .Values.mobile.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ump.fullname" . }}-mobile
  labels:
    {{- include "ump.labels" . | nindent 4 }}
    app.kubernetes.io/component: mobile
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.mobile.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "ump.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: mobile
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
      labels:
        {{- include "ump.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: mobile
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "ump.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: mobile
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.global.imageRegistry | default .Values.image.registry }}/{{ .Values.mobile.image.repository }}:{{ .Values.mobile.image.tag | default .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.mobile.env.PORT }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: {{ include "ump.fullname" . }}-config
                  key: MOBILE_NODE_ENV
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "ump.fullname" . }}-config
                  key: MOBILE_PORT
            - name: NEXT_PUBLIC_GRAPHQL_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "ump.fullname" . }}-config
                  key: NEXT_PUBLIC_GRAPHQL_URL
            - name: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "ump.fullname" . }}-secret
                  key: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
            - name: CLERK_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "ump.fullname" . }}-secret
                  key: CLERK_SECRET_KEY
          resources:
            {{- toYaml .Values.mobile.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: nextjs-cache
              mountPath: /app/.next
      volumes:
        - name: tmp
          emptyDir: {}
        - name: nextjs-cache
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}