{{- if and .Values.postgresql.enabled .Values.postgresql.primary.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "ump.fullname" . }}-postgres-pvc
  labels:
    {{- include "ump.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  accessModes:
    - {{ .Values.postgresql.primary.persistence.accessMode | default "ReadWriteOnce" | quote }}
  resources:
    requests:
      storage: {{ .Values.postgresql.primary.persistence.size | quote }}
  {{- if .Values.postgresql.primary.persistence.storageClass }}
  {{- if (eq "-" .Values.postgresql.primary.persistence.storageClass) }}
  storageClassName: ""
  {{- else }}
  storageClassName: {{ .Values.postgresql.primary.persistence.storageClass | quote }}
  {{- end }}
  {{- end }}
{{- end }}