apiVersion: v1
kind: Service
metadata:
  name: {{ include "ump.fullname" . }}-admin
  labels:
    {{- include "ump.labels" . | nindent 4 }}
    app.kubernetes.io/component: admin
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "ump.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: admin

---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ump.fullname" . }}-mobile
  labels:
    {{- include "ump.labels" . | nindent 4 }}
    app.kubernetes.io/component: mobile
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "ump.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: mobile

---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ump.fullname" . }}-backend
  labels:
    {{- include "ump.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  ports:
    - port: 4000
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "ump.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend

---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ump.fullname" . }}-gateway
  labels:
    {{- include "ump.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  type: ClusterIP
  ports:
    - port: 4001
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "ump.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: gateway