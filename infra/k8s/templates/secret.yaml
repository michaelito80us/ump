---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ump.fullname" . }}-secrets
  labels:
    {{- include "ump.labels" . | nindent 4 }}
type: Opaque
data:
  # Database credentials
  postgres-password: {{ .Values.postgresql.auth.password | b64enc | quote }}
  database-url: {{ printf "postgresql://%s:%s@%s-postgresql:5432/%s" .Values.postgresql.auth.username .Values.postgresql.auth.password (include "ump.fullname" .) .Values.postgresql.auth.database | b64enc | quote }}
  
  # Redis credentials
  redis-password: {{ .Values.redis.auth.password | default "" | b64enc | quote }}
  redis-url: {{ printf "redis://:%s@%s-redis-master:6379" (.Values.redis.auth.password | default "") (include "ump.fullname" .) | b64enc | quote }}
  
  # JWT Secret
  jwt-secret: {{ .Values.secrets.jwtSecret | required "JWT secret is required" | b64enc | quote }}
  
  # Clerk Authentication
  clerk-publishable-key: {{ .Values.secrets.clerkPublishableKey | required "Clerk publishable key is required" | b64enc | quote }}
  clerk-secret-key: {{ .Values.secrets.clerkSecretKey | required "Clerk secret key is required" | b64enc | quote }}
  clerk-webhook-secret: {{ .Values.secrets.clerkWebhookSecret | default "" | b64enc | quote }}
  
  # API Keys and External Services
  openai-api-key: {{ .Values.secrets.openaiApiKey | default "" | b64enc | quote }}
  stripe-secret-key: {{ .Values.secrets.stripeSecretKey | default "" | b64enc | quote }}
  stripe-webhook-secret: {{ .Values.secrets.stripeWebhookSecret | default "" | b64enc | quote }}
  sendgrid-api-key: {{ .Values.secrets.sendgridApiKey | default "" | b64enc | quote }}
  
  # Analytics and Monitoring
  sentry-dsn: {{ .Values.secrets.sentryDsn | default "" | b64enc | quote }}
  mixpanel-token: {{ .Values.secrets.mixpanelToken | default "" | b64enc | quote }}
  google-analytics-id: {{ .Values.secrets.googleAnalyticsId | default "" | b64enc | quote }}
  
  # File Storage
  aws-access-key-id: {{ .Values.secrets.awsAccessKeyId | default "" | b64enc | quote }}
  aws-secret-access-key: {{ .Values.secrets.awsSecretAccessKey | default "" | b64enc | quote }}
  aws-s3-bucket: {{ .Values.secrets.awsS3Bucket | default "" | b64enc | quote }}
  aws-region: {{ .Values.secrets.awsRegion | default "us-east-1" | b64enc | quote }}
  
  # Push Notifications
  firebase-project-id: {{ .Values.secrets.firebaseProjectId | default "" | b64enc | quote }}
  firebase-private-key: {{ .Values.secrets.firebasePrivateKey | default "" | b64enc | quote }}
  firebase-client-email: {{ .Values.secrets.firebaseClientEmail | default "" | b64enc | quote }}
  
  # Security
  encryption-key: {{ .Values.secrets.encryptionKey | default "" | b64enc | quote }}
  session-secret: {{ .Values.secrets.sessionSecret | default "" | b64enc | quote }}
  
  # Monitoring and Logging
  datadog-api-key: {{ .Values.secrets.datadogApiKey | default "" | b64enc | quote }}
  newrelic-license-key: {{ .Values.secrets.newrelicLicenseKey | default "" | b64enc | quote }}
  
  # CDN and Assets
  cloudflare-api-token: {{ .Values.secrets.cloudflareApiToken | default "" | b64enc | quote }}
  
  # Database Migration
  migration-password: {{ .Values.secrets.migrationPassword | default .Values.postgresql.auth.password | b64enc | quote }}