---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ump.fullname" . }}-secret
  labels:
    {{- include "ump.labels" . | nindent 4 }}
type: Opaque
data:
  # Database credentials
  POSTGRES_PASSWORD: {{ .Values.postgresql.auth.password | b64enc | quote }}
  DATABASE_URL: {{ printf "postgresql://%s:%s@%s-postgresql:5432/%s" .Values.postgresql.auth.username .Values.postgresql.auth.password (include "ump.fullname" .) .Values.postgresql.auth.database | b64enc | quote }}
  
  # Redis URL
  REDIS_URL: {{ printf "redis://%s-redis-master:6379" (include "ump.fullname" .) | b64enc | quote }}
  
  # JWT Secret (should be overridden in production)
  JWT_SECRET: {{ "prod-jwt-secret-change-me" | b64enc | quote }}
  
  # Clerk Auth (placeholder - should be set via external secrets)
  CLERK_SECRET_KEY: {{ "" | b64enc | quote }}
  NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: {{ "" | b64enc | quote }}
  
  # AWS credentials for backup (should be set via external secrets in production)
  AWS_ACCESS_KEY_ID: {{ "" | b64enc | quote }}
  AWS_SECRET_ACCESS_KEY: {{ "" | b64enc | quote }}