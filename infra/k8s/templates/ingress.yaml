{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "ump.fullname" . }}
  labels:
    {{- include "ump.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if and .Values.ingress.className (semverCompare ">=1.18-0" .Capabilities.KubeVersion.GitVersion) }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          # Admin application
          - path: /admin
            pathType: Prefix
            backend:
              service:
                name: {{ include "ump.fullname" $ }}-admin
                port:
                  number: {{ $.Values.service.port }}
          # Mobile application
          - path: /mobile
            pathType: Prefix
            backend:
              service:
                name: {{ include "ump.fullname" $ }}-mobile
                port:
                  number: {{ $.Values.service.port }}
          # API Gateway
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "ump.fullname" $ }}-gateway
                port:
                  number: 4001
          # GraphQL endpoint
          - path: /graphql
            pathType: Prefix
            backend:
              service:
                name: {{ include "ump.fullname" $ }}-gateway
                port:
                  number: 4001
          # WebSocket endpoint
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: {{ include "ump.fullname" $ }}-gateway
                port:
                  number: 4001
          # Health check endpoint
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: {{ include "ump.fullname" $ }}-gateway
                port:
                  number: 4001
          # Default route to admin
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "ump.fullname" $ }}-admin
                port:
                  number: {{ $.Values.service.port }}
    {{- end }}
{{- end }}