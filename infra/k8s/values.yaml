# Default values for UMP
# This is a YAML-formatted file.

# Global settings
global:
  imageRegistry: ""
  imagePullSecrets: []
  storageClass: ""

# Image settings
image:
  registry: docker.io
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

# Service account
serviceAccount:
  create: true
  annotations: {}
  name: ""

# Pod security context
podSecurityContext:
  fsGroup: 2000

# Security context
securityContext:
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000

# Resources
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity
affinity: {}

# PostgreSQL configuration
postgresql:
  enabled: true
  auth:
    postgresPassword: "ump-postgres-password"
    username: "ump_user"
    password: "ump_password"
    database: "ump_prod"
  primary:
    persistence:
      enabled: true
      size: 8Gi
    resources:
      limits:
        cpu: 1000m
        memory: 1Gi
      requests:
        cpu: 500m
        memory: 512Mi

# Redis configuration
redis:
  enabled: true
  auth:
    enabled: false
  master:
    persistence:
      enabled: true
      size: 2Gi
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 250m
        memory: 256Mi

# Backend service
backend:
  enabled: true
  replicaCount: 2
  image:
    repository: ump/backend
    tag: latest
  service:
    type: ClusterIP
    port: 4001
  env:
    NODE_ENV: production
    PORT: 4001
    GRAPHQL_INTROSPECTION: false
    GRAPHQL_PLAYGROUND: false
    LOG_LEVEL: INFO
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 500m
      memory: 512Mi

# Gateway service
gateway:
  enabled: true
  replicaCount: 2
  image:
    repository: ump/gateway
    tag: latest
  service:
    type: ClusterIP
    port: 3000
  env:
    NODE_ENV: production
    PORT: 3000
    GRAPHQL_INTROSPECTION: false
    LOG_LEVEL: INFO
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 500m
      memory: 512Mi

# Admin app
admin:
  enabled: true
  replicaCount: 2
  image:
    repository: ump/admin
    tag: latest
  service:
    type: ClusterIP
    port: 3000
  env:
    NODE_ENV: production
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi

# Mobile app
mobile:
  enabled: true
  replicaCount: 2
  image:
    repository: ump/mobile
    tag: latest
  service:
    type: ClusterIP
    port: 3001
  env:
    NODE_ENV: production
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi

# Ingress configuration
ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: ump.local
      paths:
        - path: /
          pathType: Prefix
          service: gateway
        - path: /admin
          pathType: Prefix
          service: admin
        - path: /mobile
          pathType: Prefix
          service: mobile
  tls: []
  #  - secretName: ump-tls
  #    hosts:
  #      - ump.local

# Autoscaling
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80