# Default values for UMP
# This is a YAML-formatted file.

# Global settings
global:
  imageRegistry: "ghcr.io"
  imagePullSecrets: []
  storageClass: ""
  environment: "production"

# Image settings
image:
  registry: ghcr.io
  repository: "ump"
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "latest"

# Service account
serviceAccount:
  create: true
  annotations: {}
  name: ""

# Pod security context
podSecurityContext:
  fsGroup: 2000

# Security context
securityContext:
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000

# Default resources
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

# Replica count
replicaCount: 2

# Service configuration
service:
  type: ClusterIP
  port: 3000

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity
affinity: {}

# PostgreSQL configuration
postgresql:
  enabled: true
  auth:
    postgresPassword: "ump-postgres-password"
    username: "ump_user"
    password: "ump_password"
    database: "ump_prod"
  primary:
    persistence:
      enabled: true
      size: 8Gi
    resources:
      limits:
        cpu: 1000m
        memory: 1Gi
      requests:
        cpu: 500m
        memory: 512Mi

# Redis configuration
redis:
  enabled: true
  auth:
    enabled: false
  master:
    persistence:
      enabled: true
      size: 2Gi
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 250m
        memory: 256Mi

# Backend service
backend:
  enabled: true
  replicaCount: 2
  image:
    repository: ump/backend
    tag: latest
  service:
    type: ClusterIP
    port: 4001
  env:
    NODE_ENV: production
    PORT: 4001
    GRAPHQL_INTROSPECTION: false
    GRAPHQL_PLAYGROUND: false
    LOG_LEVEL: INFO
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 500m
      memory: 512Mi

# Gateway service
gateway:
  enabled: true
  replicaCount: 2
  image:
    repository: ump/gateway
    tag: latest
  service:
    type: ClusterIP
    port: 3000
  env:
    NODE_ENV: production
    PORT: 3000
    GRAPHQL_INTROSPECTION: false
    LOG_LEVEL: INFO
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 500m
      memory: 512Mi

# Admin app
admin:
  enabled: true
  replicaCount: 2
  image:
    repository: ump/admin
    tag: latest
  service:
    type: ClusterIP
    port: 3000
  env:
    NODE_ENV: production
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi

# Mobile app
mobile:
  enabled: true
  replicaCount: 2
  image:
    repository: ump/mobile
    tag: latest
  service:
    type: ClusterIP
    port: 3001
  env:
    NODE_ENV: production
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi

# Ingress configuration
ingress:
  enabled: true
  className: "nginx"
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization"
  host: "ump.example.com"
  hosts:
    - host: ump.example.com
  tls:
    - secretName: ump-tls
      hosts:
        - ump.example.com

# Configuration values
config:
  graphqlHttpUrl: "https://ump.example.com/api/graphql"
  graphqlWsUrl: "wss://ump.example.com/api/graphql"
  corsOrigin: "https://ump.example.com"
  corsOrigins: "https://ump.example.com"
  coreSubgraphUrl: "http://ump-backend:4000/graphql"
  logLevel: "info"
  graphqlIntrospection: "false"
  graphqlPlayground: "false"
  enableAnalytics: "true"
  enableMonitoring: "true"
  enableWebsockets: "true"
  cdnUrl: ""
  assetsUrl: ""
  rateLimitWindow: "900000"
  rateLimitMax: "100"
  healthCheckTimeout: "5000"
  healthCheckInterval: "30000"

# Secrets configuration (should be overridden in production)
secrets:
  jwtSecret: "change-me-in-production"
  clerkPublishableKey: ""
  clerkSecretKey: ""
  clerkWebhookSecret: ""
  openaiApiKey: ""
  stripeSecretKey: ""
  stripeWebhookSecret: ""
  sendgridApiKey: ""
  sentryDsn: ""
  mixpanelToken: ""
  googleAnalyticsId: ""
  awsAccessKeyId: ""
  awsSecretAccessKey: ""
  awsS3Bucket: ""
  awsRegion: "us-east-1"
  firebaseProjectId: ""
  firebasePrivateKey: ""
  firebaseClientEmail: ""
  encryptionKey: ""
  sessionSecret: ""
  datadogApiKey: ""
  newrelicLicenseKey: ""
  cloudflareApiToken: ""
  migrationPassword: ""

# Backup configuration
backup:
  enabled: true
  schedule: "0 2 * * *"  # Daily at 2 AM UTC
  retention:
    days: 30
  s3:
    bucket: "ump-backups"
    region: "us-east-1"
    prefix: "postgres-backups"
  image:
    repository: postgres
    tag: "15-alpine"
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi

# Autoscaling
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80