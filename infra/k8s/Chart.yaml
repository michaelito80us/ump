apiVersion: v2
name: ump
description: Unified Management Platform - Tournament management system
type: application
version: 0.1.0
appVersion: "1.0.0"

keywords:
  - tournament
  - sports
  - management
  - graphql
  - nextjs

maintainers:
  - name: UMP Team
    email: team@ump.dev

dependencies:
  - name: postgresql
    version: "12.x.x"
    repository: "https://charts.bitnami.com/bitnami"
    condition: postgresql.enabled
  - name: redis
    version: "17.x.x"
    repository: "https://charts.bitnami.com/bitnami"
    condition: redis.enabled

engine: gotpl